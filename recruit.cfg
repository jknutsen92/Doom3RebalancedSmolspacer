// g_skill=0
seta g_damageScale                  "1.0"   // Damage multiplier relative to base values
seta g_armorProtection              "1"     // Ratio of damage that armor absorbs, the rest is taken as health damage
seta g_armorStripScale              "0.6"   // Multiplies by armor damage to determine how much armor is removed on hit
seta g_maxAmmoScale                 "1.5"   // Scales the max ammo pool for each ammo class uniformally relative to the base values defined in ammo.def
seta g_itemValueScale               "1.5"   // Scales the amount of resources granted by all pickups including medkits, ammo, armor. Base values defined in item.def and ammo.def
seta g_pAreaDmgScale                "0.1"   // For the plasmagun heat mod. Controls the damage scaling of the heatblast based on target mass 
seta g_pMassRadiusScale             "0.7"   // For the plasmagun heat mod. Controls the radius of the heatblast based on target mass
seta g_pMassPushScale               "1.0"   // For the plasmagun heat mod. Controls the physics push of the heatblast explosion based on mass
seta g_ragdollRezProbability        "0.15"  // The likelihood that a ragdoll will resurrect into another demon 
seta g_ragdollRezBoundsSize         "1000.0"// Controls the size of the bounding box used for confirming the player has encountered the ragdoll first
seta g_ragdollRezMinDelay           "5"     // The minimum time before the ragdoll resurrects
seta g_ragdollRezMaxDelay           "30"    // The maximum time before the ragdoll resurrects